# CI: build and test the feature combinations that matter.
#
# Default features are empty, so a default-only run compiles none of the
# codec/device/network code. The "sensor" combo is the feature set the
# zensight video sensor builds against — pinning it here is the point of
# this workflow (the zenoh and rtp features once bit-rotted to
# non-compiling because nothing built them; see #20).
#
# Deliberately NOT --all-features: dav1d/alsa/pipewire/opus/fdk-aac need
# system libraries, and vulkan-video carries pre-existing lint debt
# tracked in #3. libcamera gets its own Fedora-container job below
# (ubuntu-latest ships libcamera 0.2, too old for the 0.7 crate).

name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SENSOR_FEATURES: zenoh,h264,v4l2,rtp,rtsp,image-jpeg,hotplug

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check

  test-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run
      - run: cargo test --doc

  test-sensor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # libudev for the hotplug feature; g++ builds bundled OpenH264.
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev g++
      - run: cargo check --all-targets --features "$SENSOR_FEATURES"
      - run: cargo nextest run --features "$SENSOR_FEATURES"

  # V4L2 M2M hardware encoder: build + lint the feature, then exercise the
  # real queue/drain state machine against the vicodec virtual driver.
  # v4l2r generates kernel-header bindings at build time (needs libclang).
  test-v4l2-m2m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev "linux-modules-extra-$(uname -r)"
      - run: sudo modprobe vicodec
      - run: sudo chmod a+rw /dev/video*
      - run: cargo clippy --all-targets --features v4l2-m2m -- -D warnings
      - run: cargo nextest run --features v4l2-m2m -E 'test(v4l2_m2m)' --no-capture
        env:
          PARALLAX_VICODEC_TEST_DEVICE: auto

  # libcamera + hotplug folding: lint and run the unit tests. Needs system
  # libcamera >= 0.4 with dev headers (the crate binds via pkg-config at
  # build time), which ubuntu-latest is too old to provide — use Fedora.
  # No camera in CI: hardware tests skip via their env gate.
  test-libcamera:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      # git/tar/xz/zstd for the checkout, toolchain and cache actions
      - run: >
          dnf install -y gcc gcc-c++ clang-devel libcamera-devel
          systemd-devel pkgconf-pkg-config git tar xz zstd
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo clippy --all-targets --features libcamera,hotplug -- -D warnings
      - run: cargo nextest run --features libcamera,hotplug -E 'test(libcamera) | test(monitor)'

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev g++
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features "$SENSOR_FEATURES,image-codecs,zenoh-unstable" -- -D warnings

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev g++
      - run: cargo doc --no-deps --features "$SENSOR_FEATURES,image-codecs,zenoh-unstable"
        env:
          RUSTDOCFLAGS: -D warnings
