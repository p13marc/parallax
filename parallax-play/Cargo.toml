[package]
name = "parallax-play"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "A video player built on parallax and Iced"
license = "MIT OR Apache-2.0"

[[bin]]
name = "parallax-play"
path = "src/main.rs"

[dependencies]
# Deliberately *not* `display` or `display-gpu`: those pull winit and a
# different wgpu major, and an Iced application owns the event loop itself.
# `parallax-iced` brings the only wgpu in this tree, Iced's.
parallax = { package = "parallax-pipeline", path = "..", features = [
    "mp4-demux",
    "mkv-demux",
    "vpx",
    "av1-decode",
    "opus",
    "h264",
    "audio-aac",
    "audio-vorbis",
    "eac3",
    "alsa",
    "vaapi",
] }
parallax-iced = { path = "../parallax-iced" }
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tokio",
    "advanced",
    "x11",
    "wayland",
] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
