[package]
name = "example-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Example plugin for Parallax"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Package renamed to parallax-pipeline; the lib name is still `parallax`,
# so `use parallax::...` works unchanged.
parallax-pipeline = { path = "../.." }
paste = "1.0"
