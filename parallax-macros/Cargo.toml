[package]
# Published as `parallax-pipeline-macros`; the lib target keeps the import
# name `parallax_macros` (matches the root package's renamed dependency key).
name = "parallax-pipeline-macros"
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
description = "Procedural macros for Parallax, the Rust-native streaming pipeline engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/p13marc/parallax"
documentation = "https://docs.rs/parallax-pipeline-macros"

[lib]
name = "parallax_macros"
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
