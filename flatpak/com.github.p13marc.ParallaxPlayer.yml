app-id: com.github.p13marc.ParallaxPlayer
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # bindgen (libva FFI) needs libclang; the base Sdk ships NO clang at all
  - org.freedesktop.Sdk.Extension.llvm20
command: parallax-player

# CI builds and tests this flatpak with SOFTWARE RENDERING ONLY -- the runner
# has no GPU, so wgpu falls back to Mesa's llvmpipe from the 25.08 Platform
# and VA-API probing fails cleanly into the software decoders. A black window
# or "no suitable adapter" in a GPU-less environment is expected, not a bug.
# GPU paths are validated on the workstation hardware lane
# (PARALLAX_FORCE_GPU=1). Do NOT bundle GPU drivers here.

finish-args:
  # Wayland and X11 display access
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU acceleration for Iced/wgpu (harmless without a GPU: llvmpipe fallback)
  - --device=dri
  # Audio playback (the runtime's alsa-lib routes to PulseAudio/PipeWire
  # through the bundled pulse plugin, matching the player's `alsa` feature)
  - --socket=pulseaudio
  # Media access. The file dialog goes through the XDG portal (ashpd), but
  # the player also takes plain paths on the command line and writes
  # snapshots (#283) as a PNG *beside the source file*, so it needs real,
  # writable access to where media lives.
  - --filesystem=home

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
  env:
    CARGO_HOME: /run/build/parallax-player/cargo
    LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
    RUST_BACKTRACE: "1"
    # Cap build parallelism INSIDE the sandbox: flatpak-builder does not
    # inherit the workflow env, and this is the heaviest crate graph in the
    # fleet -- the CI runner is memory-capped.
    CARGO_BUILD_JOBS: "2"

modules:
  - name: parallax-player
    buildsystem: simple
    build-options:
      # Allow network during build to fetch crates
      build-args:
        - --share=network
    build-commands:
      # The workspace's default-members is the root crate alone -- the player
      # must be named explicitly. Its codec feature set (vpx, dav1d, opus,
      # alsa, libva/vaapi) links system libs that all ship in the 25.08
      # Platform; headers come from the Sdk and libclang (bindgen) from the
      # llvm20 extension via LIBCLANG_PATH -- the base Sdk has no clang.
      - cargo fetch --manifest-path Cargo.toml
      - cargo build --release -p parallax-player
      - install -Dm755 target/release/parallax-player ${FLATPAK_DEST}/bin/parallax-player
      - install -Dm644 flatpak/com.github.p13marc.ParallaxPlayer.desktop ${FLATPAK_DEST}/share/applications/com.github.p13marc.ParallaxPlayer.desktop
      - install -Dm644 flatpak/com.github.p13marc.ParallaxPlayer.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.github.p13marc.ParallaxPlayer.metainfo.xml
      - install -Dm644 flatpak/icons/hicolor/scalable/apps/com.github.p13marc.ParallaxPlayer.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/com.github.p13marc.ParallaxPlayer.svg
      - install -Dm644 flatpak/icons/hicolor/symbolic/apps/com.github.p13marc.ParallaxPlayer-symbolic.svg ${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps/com.github.p13marc.ParallaxPlayer-symbolic.svg
    sources:
      - type: dir
        path: ..
        skip:
          # never copy build state into the sandbox (a local target/ can be
          # tens of GB; CI stages from a fresh checkout so these are empty)
          - target
          - builddir
          - .flatpak-builder
          - export-repo
