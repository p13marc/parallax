# cargo-deny configuration (fleet standard, myserver#33: cargo-deny is the
# single supply-chain lint). See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
# All transitive — unactionable here. Re-check on dep bumps (2026-11-22: the
# `cargo update` that cleared the url/quinn-proto/rustls/webpki advisories
# also retired five entries no crate in the graph matches any more, and met
# three new "unmaintained" notices with no release to move to. The zbus 5
# family's three were actionable — ashpd 0.14 is on zbus 6 — and are gone).
ignore = [
    "RUSTSEC-2023-0071", # rsa: Marvin timing sidechannel — no fixed release exists
    "RUSTSEC-2024-0436", # paste unmaintained
    "RUSTSEC-2024-0449", # unsafe-libyaml unmaintained (serde_yaml, via zenoh-config)
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained
    "RUSTSEC-2026-0041", # lz4_flex decompress leak — zenoh pins 0.10, fix is in a later minor
    # audiopus_sys unmaintained (opus 0.3's FFI). opus 0.4 replaces it with
    # opusic-sys, which does not link the system libopus: it compiles a
    # vendored copy with cmake. That changes what the `opus` feature needs to
    # build and where the codec's security fixes come from, so it is a
    # decision, not a bump — held at 0.3 until it is made.
    "RUSTSEC-2026-0150",
    "RUSTSEC-2026-0192", # ttf-parser unmaintained (via iced's font stack)
    "RUSTSEC-2026-0441", # pin-utils archived (nix 0.26, via webrtc-util)
    "RUSTSEC-2026-0542", # humantime unmaintained (uhlc, via zenoh)
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    # Community Data License Agreement – Permissive 2.0. Used by
    # `webpki-roots` (the Mozilla CA bundle) in zenoh's TLS stack.
    "CDLA-Permissive-2.0",
    # Codec crates carry compound expressions: `(MIT OR Apache-2.0) AND NCSA`
    # and `(MIT OR Apache-2.0) AND IJG` (jpeg). Both permissive, OSI-listed.
    "NCSA",
    "IJG",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
