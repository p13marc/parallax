[workspace]
members = [".", "parallax-macros", "parallax-player", "examples/example-plugin"]
# The default build set stays exactly what a bare `cargo <cmd>` built before
# the player existed: the root package alone. Anything wider changes what CI
# compiles — adding the player would unify its features (h264/display/...)
# into every workspace-wide invocation, and even adding example-plugin
# surfaces clippy findings CI never gated on. Build the others explicitly:
# `cargo run -p parallax-player -- file.mp4`, `cargo clippy -p example-plugin`.
default-members = ["."]

[package]
# Package is `parallax-pipeline` on crates.io (the bare name is squatted);
# the lib target below keeps the import name `parallax`.
name = "parallax-pipeline"
version = "0.6.0"
edition = "2024"
rust-version = "1.97"
description = "Parallax: a Rust-native streaming pipeline engine with zero-copy multi-process support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/p13marc/parallax"
homepage = "https://github.com/p13marc/parallax"
documentation = "https://docs.rs/parallax-pipeline"
keywords = ["streaming", "pipeline", "zero-copy", "dataflow"]
categories = ["multimedia", "asynchronous", "data-structures"]

[lib]
name = "parallax"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "io-util", "macros", "sync", "time"] }

# Channels (fast, MPMC, sync+async)
kanal = "0.1"

# Graph structure (enforces DAG)
daggy = { version = "0.9", features = ["stable_dag"] }

# Parsing
winnow = "1"

# Serialization (zero-copy)
rkyv = { version = "0.8", features = ["bytecheck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Buffer utilities
bytes = "1"
smallvec = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Metrics & logging
metrics = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Linux system APIs (memfd, mmap, SCM_RIGHTS, eventfd)
rustix = { version = "1.0", features = ["mm", "fs", "net", "process", "pipe", "stdio", "event", "param"] }
libc = "0.2"
futures = "0.3.31"
libloading = "0.9"
paste = "1.0.15"

# Proc macros (optional, for plugin authoring convenience)
parallax-macros = { package = "parallax-pipeline-macros", version = "0.1.2", path = "parallax-macros", optional = true }

# HTTP client (optional)
ureq = { version = "3", optional = true }

# WebSocket (optional)
tungstenite = { version = "0.29", optional = true }

# Zenoh pub/sub (optional)
zenoh = { version = "1.9", optional = true }

# RTP/RTCP (optional, from webrtc-rs; rtp/rtcp 0.17 share webrtc-util 0.17)
rtp = { version = "0.17", optional = true }
rtcp = { version = "0.17", optional = true }
webrtc-util = { version = "0.17", optional = true }

# RTSP client (optional)
retina = { version = "0.4", optional = true }
url = { version = "2", optional = true }

# MPEG-TS demuxer (optional)
mpeg2ts-reader = { version = "0.18", optional = true }

# Display (winit + softbuffer for autovideosink)
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }

# Vulkan Video (optional)
# Note: no gpu-allocator. src/gpu/vulkan/memory.rs allocates directly against
# the queried memory types, so the crate was declared but never referenced.
ash = { version = "0.38", optional = true }

# H.264 bitstream parsing (optional)
h264-reader = { version = "0.8", optional = true }

# AV1 software codecs (optional)
# rav1e: use default-features=false to skip asm (slower), or install nasm for optimized builds
rav1e = { version = "0.8", optional = true, default-features = false, features = ["threading"] }
# dav1d requires system library (libdav1d-devel on Fedora, libdav1d-dev on Debian)
dav1d = { version = "0.11", optional = true }

# H.264 codec (OpenH264 - ships with source, compiles automatically)
openh264 = { version = "0.9", optional = true }
openh264-sys2 = { version = "0.9", optional = true }

# Audio codecs - Symphonia (pure Rust)
symphonia = { version = "0.6", optional = true, default-features = false }

# Image codecs (pure Rust)
zune-jpeg = { version = "0.5", optional = true }
jpeg-encoder = { version = "0.7", default-features = false, features = ["std", "simd"], optional = true }
png = { version = "0.18", optional = true }

# Color space conversion (SIMD-accelerated, pure Rust)
yuv = { version = "0.8", optional = true }

# Container formats (pure Rust)
mp4 = { version = "0.14", optional = true }
matroska-demuxer = { version = "0.8", optional = true }

# VP8/VP9 codec (bindings to system libvpx; `generate` runs bindgen against
# the installed headers so any libvpx version works, at the cost of libclang
# at build time)
env-libvpx-sys = { version = "5", optional = true, features = ["generate"] }

# Opus audio codec (bindings to libopus)
opus = { version = "0.3", optional = true }

# AC-3 / E-AC-3 audio decoder (pure Rust; young crate — pin exact).
# oxideav-core supplies the Packet/Decoder types its API speaks.
oxideav-ac3 = { version = "=0.0.10", optional = true }
oxideav-core = { version = "0.1", optional = true }

# AAC audio encoder (bindings to FDK-AAC - note license restrictions)
fdk-aac = { version = "0.6", optional = true }

# PipeWire (audio/video capture and playback)
pipewire = { version = "0.8", optional = true }

# libcamera (modern camera API; needs system libcamera >= 0.4 with dev headers,
# the crate picks matching pregenerated bindings via pkg-config at build time)
libcamera = { version = "0.7", optional = true }

# V4L2 (fallback video capture)
v4l = { version = "0.14", optional = true }

# V4L2 M2M stateful hardware codecs (pinned: 0.0.x API is unstable;
# builds bindings from kernel headers, needs libclang at build time)
v4l2r = { version = "=0.0.7", optional = true }

# udev device monitoring (hotplug)
udev = { version = "0.9", features = ["send"], optional = true }

# ALSA (fallback audio capture/playback)
alsa = { version = "0.9", optional = true }

# XDG Portal (for screen capture permissions on Wayland)
ashpd = { version = "0.10", optional = true, default-features = false, features = ["tokio"] }

# Regex (for RegexFilter)
regex = "1"

# XML generation (for DASH MPD)
quick-xml = "0.41"

# Object-safe async traits
dynosaur = "0.3"
trait-variant = "0.1"

[dev-dependencies]
# "signal" is example-only (Ctrl-C handling); keep it out of the library deps
tokio = { version = "1", features = ["signal"] }
tokio-test = "0.4"
criterion = "0.8"
proptest = "1"
tempfile = "3.24.0"

[features]
default = []
macros = ["parallax-macros"]  # Plugin authoring macros
huge-pages = []       # MAP_HUGETLB support
rdma = []             # Future: RDMA support
vulkan-video = ["dep:ash", "dep:h264-reader"]  # Vulkan Video codecs
software-codecs = ["av1-encode", "av1-decode", "h264", "vpx"]  # All software video codecs
av1-encode = ["dep:rav1e"]  # AV1 encoder (requires nasm on x86_64)
av1-decode = ["dep:dav1d"]  # AV1 decoder (requires libdav1d system library)
vpx = ["dep:env-libvpx-sys"]  # VP8/VP9 decoder (requires libvpx system library)
h264 = ["dep:openh264", "dep:openh264-sys2"]  # H.264 encoder/decoder (OpenH264, BSD-2 licensed)
# Audio codecs (all pure Rust via Symphonia)
audio-codecs = ["audio-flac", "audio-mp3", "audio-aac", "audio-vorbis"]
audio-flac = ["dep:symphonia", "symphonia/flac"]
audio-mp3 = ["dep:symphonia", "symphonia/mp3"]
audio-aac = ["dep:symphonia", "symphonia/aac"]
audio-vorbis = ["dep:symphonia", "symphonia/vorbis"]
opus = ["dep:opus"]  # Opus audio encoder/decoder (requires libopus)
eac3 = ["dep:oxideav-ac3", "dep:oxideav-core"]  # AC-3 / E-AC-3 audio decoder (pure Rust)
aac-encode = ["dep:fdk-aac"]  # AAC audio encoder (note: FDK-AAC license restrictions)
# Image codecs (all pure Rust)
image-codecs = ["image-jpeg", "image-png"]
image-jpeg = ["dep:zune-jpeg", "dep:jpeg-encoder"]
image-png = ["dep:png"]
# Color space conversion (SIMD-accelerated)
simd-colorspace = ["dep:yuv"]
http = ["ureq"]       # HTTP source/sink elements
websocket = ["tungstenite"]  # WebSocket source/sink elements
zenoh = ["dep:zenoh"] # Zenoh pub/sub elements
zenoh-unstable = ["zenoh", "zenoh/unstable"] # reliability control + matching listeners
rtp = ["dep:rtp", "dep:rtcp", "dep:webrtc-util"]  # RTP/RTCP elements
rtsp = ["rtp", "dep:retina", "dep:url"]  # RTSP client (includes RTP support)
mpeg-ts = ["dep:mpeg2ts-reader"]  # MPEG-TS demuxer
mkv-demux = ["dep:matroska-demuxer"]  # Matroska/WebM container demuxer
mp4-demux = ["dep:mp4"]  # MP4/MOV container demuxer
display = ["dep:winit", "dep:softbuffer"]  # Video display window (autovideosink)
# Device capture (modern Linux stack)
pipewire = ["dep:pipewire"]  # PipeWire audio/video capture/playback
libcamera = ["dep:libcamera"]  # Modern camera API (Raspberry Pi, embedded, etc.)
screen-capture = ["pipewire", "dep:ashpd"]  # Screen capture via XDG portal
# Device capture (fallback/low-level)
v4l2 = ["dep:v4l"]  # V4L2 video capture (fallback for simple webcams)
v4l2-m2m = ["dep:v4l2r"]  # V4L2 M2M stateful hardware H.264 encoder
alsa = ["dep:alsa"]  # ALSA audio capture/playback (fallback)
# Combined device features
device-capture = ["pipewire", "libcamera"]  # Recommended device capture stack
device-all = ["pipewire", "libcamera", "screen-capture", "v4l2", "alsa"]  # All device capture
hotplug = ["v4l2", "dep:udev"]  # udev video device hotplug monitoring

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "media_path"
harness = false

[[bench]]
name = "memory_pool"
harness = false

[[bench]]
name = "colorspace"
harness = false

# Examples - one concept per file, numbered for learning order
# Run with: cargo run --example <name> [--features <feature>]
#
# Every example file gets an [[example]] entry, even the feature-free ones.
# Leaving one out is how 42/43/44 ended up hand-rolling `#[cfg(not(feature))]`
# stub `main`s that printed a shrug instead of failing (#9): with no entry,
# cargo builds them under default features and there is nowhere to hang
# `required-features`.

# Basic examples (01-12): no special features required
[[example]]
name = "01_hello"

[[example]]
name = "02_transform"

[[example]]
name = "03_fanout"

[[example]]
name = "04_funnel"

[[example]]
name = "05_backpressure"

[[example]]
name = "06_appsrc"

[[example]]
name = "07_file_io"

[[example]]
name = "08_tcp"

[[example]]
name = "09_typed"

[[example]]
name = "10_builder"

[[example]]
name = "11_buffer_pool"

# Caps / conversion examples: no special features required
[[example]]
name = "17_multi_format_caps"

[[example]]
name = "41_format_converters"

# Codec examples (13-16): require feature flags
[[example]]
name = "13_image"
required-features = ["image-codecs"]

[[example]]
name = "14_h264"
required-features = ["h264"]

[[example]]
name = "15_av1"
required-features = ["av1-encode"]

[[example]]
name = "16_mpegts"
required-features = ["mpeg-ts"]

[[example]]
name = "18_gpu_decode"
required-features = ["vulkan-video"]

[[example]]
name = "20_opus_audio"
required-features = ["opus"]

# Device capture examples (22-26): require device feature flags
[[example]]
name = "22_v4l2_capture"
required-features = ["v4l2"]

[[example]]
name = "23_v4l2_display"
required-features = ["v4l2", "display"]

[[example]]
name = "24_autovideosink"
required-features = ["display"]

[[example]]
name = "42_pipewire_audio"
required-features = ["pipewire"]

[[example]]
name = "43_alsa_audio"
required-features = ["alsa"]

[[example]]
name = "44_libcamera_capture"
required-features = ["libcamera"]

[[example]]
name = "45_dmabuf_negotiation"
required-features = ["v4l2"]

[[example]]
name = "46_screen_capture"
required-features = ["screen-capture", "h264", "mp4-demux"]

[[example]]
name = "57_rtsp_capture"
required-features = ["rtsp"]

[[example]]
name = "58_rtsp_display"
required-features = ["rtsp", "h264", "display"]

[[example]]
name = "59_window_events"
required-features = ["display"]

# Streaming protocol examples (25-26): no special features required
[[example]]
name = "25_hls_output"

[[example]]
name = "26_dash_output"

# Pipeline-facility examples (47-56): no special features required
[[example]]
name = "47_flow_control"

[[example]]
name = "48_clock_provider"

[[example]]
name = "49_element_retrieval"

[[example]]
name = "50_hybrid_pipeline"

[[example]]
name = "51_bus_messages"

[[example]]
name = "52_seeking"

[[example]]
name = "53_pad_probes"

[[example]]
name = "54_tracers"

[[example]]
name = "55_queue2_buffering"

[[example]]
name = "56_typefind"
