name: CI
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SENSOR_FEATURES: zenoh,h264,v4l2,rtp,rtsp,image-jpeg,hotplug
  # Pure-Rust media/container combo (no system libs needed; http = ureq/rustls)
  MEDIA_FEATURES: mp4-demux,mkv-demux,mpeg-ts,audio-aac,audio-vorbis,http
  # shared compiler cache: sccache (mounted from the runner VM) -> garage S3
  # on vm-runner-01; S3 endpoint+credentials come from the runner's env_file
  RUSTC_WRAPPER: /srv/cache/bin/sccache
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev g++ libclang-dev
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: set -o pipefail; cargo clippy --all-targets -- -D warnings 2>&1 | tee -a /tmp/ci-step.log
      - run: set -o pipefail; cargo clippy --all-targets --features "$SENSOR_FEATURES,image-codecs,zenoh-unstable" -- -D warnings 2>&1 | tee -a /tmp/ci-step.log
      - run: set -o pipefail; cargo clippy --all-targets --features "$MEDIA_FEATURES" -- -D warnings 2>&1 | tee -a /tmp/ci-step.log
      # TEMPORARY (#203). This Forgejo's API exposes no endpoint for Actions
      # logs, so a red job is invisible to anything but a browser session.
      # Post the disk state and the tail of the failing command to the
      # tracking issue instead. Delete this step, and the `tee` above, once
      # the cause is known. Internal URL for the same reason release.yml uses
      # one: the runner zone cannot hairpin to the public vhost.
      - name: report failure to #203
        if: failure()
        env:
          JOB: ${{ github.job }}
        run: |
          {
            echo "### \`$JOB\` — $(echo "$GITHUB_SHA" | cut -c1-8) — run $GITHUB_RUN_NUMBER"
            echo
            echo '```'
            echo "== df -h =="; df -h / /tmp "$GITHUB_WORKSPACE" 2>&1 | sort -u
            echo "== target =="; du -sh "$GITHUB_WORKSPACE/target" 2>&1 || true
            echo "== free =="; free -h 2>&1 | head -3
            echo "== tail of the failing command =="
            tail -100 /tmp/ci-step.log 2>&1 || echo "(nothing captured — failed before the build step)"
            echo '```'
          } > /tmp/ci-report.md
          python3 -c "import json; print(json.dumps({'body': open('/tmp/ci-report.md').read()[:60000]}))" > /tmp/ci-report.json
          curl -sS -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H 'Content-Type: application/json' --data @/tmp/ci-report.json \
            "http://10.10.0.30:3000/api/v1/repos/$GITHUB_REPOSITORY/issues/203/comments" >/dev/null

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev g++ libclang-dev
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - uses: https://github.com/taiki-e/install-action@v2.86.1
        with:
          tool: cargo-nextest
      - run: set -o pipefail; cargo nextest run 2>&1 | tee -a /tmp/ci-step.log
      - run: set -o pipefail; cargo test --doc 2>&1 | tee -a /tmp/ci-step.log
      # #176: the job's three feature combos build into one container
      # overlay on the runner's 50G root disk, and their combined target/
      # no longer fits — the third build died with ENOSPC (and an ld Bus
      # error, which is the same failure wearing a disguise). Dropping
      # target/ between combos caps the peak at one combo's worth; the
      # recompile is cheap because sccache serves it from garage S3.
      - run: rm -rf target
      - run: set -o pipefail; cargo check --all-targets --features "$SENSOR_FEATURES" 2>&1 | tee -a /tmp/ci-step.log
      - run: set -o pipefail; cargo nextest run --features "$SENSOR_FEATURES" 2>&1 | tee -a /tmp/ci-step.log
      - run: rm -rf target
      - run: set -o pipefail; cargo nextest run --features "$MEDIA_FEATURES" 2>&1 | tee -a /tmp/ci-step.log
      # TEMPORARY (#203). This Forgejo's API exposes no endpoint for Actions
      # logs, so a red job is invisible to anything but a browser session.
      # Post the disk state and the tail of the failing command to the
      # tracking issue instead. Delete this step, and the `tee` above, once
      # the cause is known. Internal URL for the same reason release.yml uses
      # one: the runner zone cannot hairpin to the public vhost.
      - name: report failure to #203
        if: failure()
        env:
          JOB: ${{ github.job }}
        run: |
          {
            echo "### \`$JOB\` — $(echo "$GITHUB_SHA" | cut -c1-8) — run $GITHUB_RUN_NUMBER"
            echo
            echo '```'
            echo "== df -h =="; df -h / /tmp "$GITHUB_WORKSPACE" 2>&1 | sort -u
            echo "== target =="; du -sh "$GITHUB_WORKSPACE/target" 2>&1 || true
            echo "== free =="; free -h 2>&1 | head -3
            echo "== tail of the failing command =="
            tail -100 /tmp/ci-step.log 2>&1 || echo "(nothing captured — failed before the build step)"
            echo '```'
          } > /tmp/ci-report.md
          python3 -c "import json; print(json.dumps({'body': open('/tmp/ci-report.md').read()[:60000]}))" > /tmp/ci-report.json
          curl -sS -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H 'Content-Type: application/json' --data @/tmp/ci-report.json \
            "http://10.10.0.30:3000/api/v1/repos/$GITHUB_REPOSITORY/issues/203/comments" >/dev/null

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev g++ libclang-dev
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: msrv
          cache-targets: false
      - run: set -o pipefail; cargo check --all-targets 2>&1 | tee -a /tmp/ci-step.log
      # Same disk discipline as the test job (#176) — msrv shares the root
      # disk with whatever else the runner is executing.
      - run: rm -rf target
      - run: set -o pipefail; cargo check --all-targets --features "$SENSOR_FEATURES" 2>&1 | tee -a /tmp/ci-step.log
      # TEMPORARY (#203). This Forgejo's API exposes no endpoint for Actions
      # logs, so a red job is invisible to anything but a browser session.
      # Post the disk state and the tail of the failing command to the
      # tracking issue instead. Delete this step, and the `tee` above, once
      # the cause is known. Internal URL for the same reason release.yml uses
      # one: the runner zone cannot hairpin to the public vhost.
      - name: report failure to #203
        if: failure()
        env:
          JOB: ${{ github.job }}
        run: |
          {
            echo "### \`$JOB\` — $(echo "$GITHUB_SHA" | cut -c1-8) — run $GITHUB_RUN_NUMBER"
            echo
            echo '```'
            echo "== df -h =="; df -h / /tmp "$GITHUB_WORKSPACE" 2>&1 | sort -u
            echo "== target =="; du -sh "$GITHUB_WORKSPACE/target" 2>&1 || true
            echo "== free =="; free -h 2>&1 | head -3
            echo "== tail of the failing command =="
            tail -100 /tmp/ci-step.log 2>&1 || echo "(nothing captured — failed before the build step)"
            echo '```'
          } > /tmp/ci-report.md
          python3 -c "import json; print(json.dumps({'body': open('/tmp/ci-report.md').read()[:60000]}))" > /tmp/ci-report.json
          curl -sS -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H 'Content-Type: application/json' --data @/tmp/ci-report.json \
            "http://10.10.0.30:3000/api/v1/repos/$GITHUB_REPOSITORY/issues/203/comments" >/dev/null

  libcamera:
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    steps:
      # no node in fedora:44 → install it first so JS actions work
      - run: dnf install -y nodejs git gcc gcc-c++ clang-devel libcamera-devel systemd-devel pipewire-devel pkgconf-pkg-config tar xz zstd
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: libcamera
          cache-targets: false
      - uses: https://github.com/taiki-e/install-action@v2.86.1
        with:
          tool: cargo-nextest
      - run: cargo clippy --all-targets --features libcamera -- -D warnings
      # #170: pipewire/screen-capture had no compiling job, which is how the
      # libspa 0.8 breakage (and before it, the e1f345b shutdown bug) went
      # unnoticed. Folded in here rather than a new job so the runner disk
      # carries one fedora target dir, not two (#176).
      - run: cargo clippy --all-targets --features pipewire,screen-capture -- -D warnings
      - run: cargo nextest run --features libcamera -E 'test(libcamera) | test(monitor)'

  # Compile-check the Vulkan Video GPU path (no runner has a capable GPU, so
  # tests would only green-skip — this at least keeps the code from rotting
  # un-compiled). image-jpeg is needed to compile elements::codec at all.
  # cargo check, not clippy: vulkan-video lint debt is tracked in #3.
  vulkan-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: vulkan
          cache-targets: false
      - run: set -o pipefail; cargo check --all-targets --features image-jpeg,vulkan-video 2>&1 | tee -a /tmp/ci-step.log
      # TEMPORARY (#203). This Forgejo's API exposes no endpoint for Actions
      # logs, so a red job is invisible to anything but a browser session.
      # Post the disk state and the tail of the failing command to the
      # tracking issue instead. Delete this step, and the `tee` above, once
      # the cause is known. Internal URL for the same reason release.yml uses
      # one: the runner zone cannot hairpin to the public vhost.
      - name: report failure to #203
        if: failure()
        env:
          JOB: ${{ github.job }}
        run: |
          {
            echo "### \`$JOB\` — $(echo "$GITHUB_SHA" | cut -c1-8) — run $GITHUB_RUN_NUMBER"
            echo
            echo '```'
            echo "== df -h =="; df -h / /tmp "$GITHUB_WORKSPACE" 2>&1 | sort -u
            echo "== target =="; du -sh "$GITHUB_WORKSPACE/target" 2>&1 || true
            echo "== free =="; free -h 2>&1 | head -3
            echo "== tail of the failing command =="
            tail -100 /tmp/ci-step.log 2>&1 || echo "(nothing captured — failed before the build step)"
            echo '```'
          } > /tmp/ci-report.md
          python3 -c "import json; print(json.dumps({'body': open('/tmp/ci-report.md').read()[:60000]}))" > /tmp/ci-report.json
          curl -sS -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H 'Content-Type: application/json' --data @/tmp/ci-report.json \
            "http://10.10.0.30:3000/api/v1/repos/$GITHUB_REPOSITORY/issues/203/comments" >/dev/null

  # Feature gates no other job compiles. `display` builds here; `pipewire` and
  # `screen-capture` build in the libcamera fedora job (#170).
  display-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev g++ libclang-dev
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        # Without this the toolchain has no clippy and the job fails with
        # "'cargo-clippy' is not installed", not with a lint.
        with:
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: display
          cache-targets: false
      - run: cargo clippy --all-targets --features display -- -D warnings

  # The last feature gates nothing else compiles. Not a theoretical gap:
  # `aac-encode` had been broken since before the version master locked —
  # `AacEncoder` called an `fdk-aac` signature no published release has — and
  # no job or recipe ever asked, so nothing reported it. Cheap to hold: all
  # four are pure-Rust or vendored-source deps that build in seconds.
  #
  #   aac-encode  fdk-aac (compiles FDK from source, hence g++)
  #   websocket   tungstenite
  #   alsa        libasound2-dev
  #   v4l2-m2m    v4l2r, bindgen against kernel headers, hence libclang-dev
  feature-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y g++ libclang-dev libasound2-dev
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: feature-gates
          cache-targets: false
      - run: cargo clippy --all-targets --features aac-encode,websocket,alsa,v4l2-m2m -- -D warnings
  # VA-API decode (#193). Runner has no GPU, so this proves the build and runs
  # the green-skip tests; real decode is validated on hardware locally.
  vaapi-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libva-dev libclang-dev libvpx-dev pkg-config g++
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: vaapi
          cache-targets: false
      - uses: https://github.com/taiki-e/install-action@v2.86.1
        with:
          tool: cargo-nextest
      - run: set -o pipefail; cargo nextest run --features vaapi,mkv-demux,mp4-demux,vpx,h264 2>&1 | tee -a /tmp/ci-step.log
      - run: set -o pipefail; cargo clippy --all-targets --features vaapi,mkv-demux,mp4-demux,vpx,h264 -- -D warnings 2>&1 | tee -a /tmp/ci-step.log
      # TEMPORARY (#203). This Forgejo's API exposes no endpoint for Actions
      # logs, so a red job is invisible to anything but a browser session.
      # Post the disk state and the tail of the failing command to the
      # tracking issue instead. Delete this step, and the `tee` above, once
      # the cause is known. Internal URL for the same reason release.yml uses
      # one: the runner zone cannot hairpin to the public vhost.
      - name: report failure to #203
        if: failure()
        env:
          JOB: ${{ github.job }}
        run: |
          {
            echo "### \`$JOB\` — $(echo "$GITHUB_SHA" | cut -c1-8) — run $GITHUB_RUN_NUMBER"
            echo
            echo '```'
            echo "== df -h =="; df -h / /tmp "$GITHUB_WORKSPACE" 2>&1 | sort -u
            echo "== target =="; du -sh "$GITHUB_WORKSPACE/target" 2>&1 || true
            echo "== free =="; free -h 2>&1 | head -3
            echo "== tail of the failing command =="
            tail -100 /tmp/ci-step.log 2>&1 || echo "(nothing captured — failed before the build step)"
            echo '```'
          } > /tmp/ci-report.md
          python3 -c "import json; print(json.dumps({'body': open('/tmp/ci-report.md').read()[:60000]}))" > /tmp/ci-report.json
          curl -sS -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H 'Content-Type: application/json' --data @/tmp/ci-report.json \
            "http://10.10.0.30:3000/api/v1/repos/$GITHUB_REPOSITORY/issues/203/comments" >/dev/null

  # The SIMD colorspace arms (the `yuv` crate) are a second implementation of
  # every conversion, selected by a feature no other job enables — and the one
  # parallax-player builds with. Untested, they rot silently (#196).
  simd-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev g++ libclang-dev
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          key: simd
          cache-targets: false
      - uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: set -o pipefail; cargo nextest run --features simd-colorspace 2>&1 | tee -a /tmp/ci-step.log
      - run: set -o pipefail; cargo clippy --all-targets --features simd-colorspace -- -D warnings 2>&1 | tee -a /tmp/ci-step.log
      # TEMPORARY (#203). This Forgejo's API exposes no endpoint for Actions
      # logs, so a red job is invisible to anything but a browser session.
      # Post the disk state and the tail of the failing command to the
      # tracking issue instead. Delete this step, and the `tee` above, once
      # the cause is known. Internal URL for the same reason release.yml uses
      # one: the runner zone cannot hairpin to the public vhost.
      - name: report failure to #203
        if: failure()
        env:
          JOB: ${{ github.job }}
        run: |
          {
            echo "### \`$JOB\` — $(echo "$GITHUB_SHA" | cut -c1-8) — run $GITHUB_RUN_NUMBER"
            echo
            echo '```'
            echo "== df -h =="; df -h / /tmp "$GITHUB_WORKSPACE" 2>&1 | sort -u
            echo "== target =="; du -sh "$GITHUB_WORKSPACE/target" 2>&1 || true
            echo "== free =="; free -h 2>&1 | head -3
            echo "== tail of the failing command =="
            tail -100 /tmp/ci-step.log 2>&1 || echo "(nothing captured — failed before the build step)"
            echo '```'
          } > /tmp/ci-report.md
          python3 -c "import json; print(json.dumps({'body': open('/tmp/ci-report.md').read()[:60000]}))" > /tmp/ci-report.json
          curl -sS -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H 'Content-Type: application/json' --data @/tmp/ci-report.json \
            "http://10.10.0.30:3000/api/v1/repos/$GITHUB_REPOSITORY/issues/203/comments" >/dev/null

  docs:
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev g++ libclang-dev
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: cargo doc --no-deps --features "$SENSOR_FEATURES,image-codecs,zenoh-unstable"
