name: CI
on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The pinned toolchain. Must equal `rust-toolchain.toml`'s channel —
  # `tests/toolchain_pin.rs` fails if it does not. Repeated here only because
  # `dtolnay/rust-toolchain` requires an explicit `toolchain:` input and will
  # not read the file.
  #
  # Not `@stable`: that is a moving target, and when it moved to 1.98 on
  # 2026-08-18 it turned seven jobs red on new clippy lints with no code
  # change. Bumping Rust is now a pull request that runs the whole matrix.
  RUST_VERSION: "1.98.0"
  # `zenoh-unstable` is in here rather than appended per-job because the
  # matching-listener demand signal (#234) lives behind it: with it only on the
  # clippy and doc jobs, a test covering that code compiled and never ran.
  SENSOR_FEATURES: zenoh,h264,v4l2,rtp,rtsp,image-jpeg,hotplug,zenoh-unstable
  # Pure-Rust media/container combo (no system libs needed; http = ureq/rustls)
  MEDIA_FEATURES: mp4-demux,mkv-demux,mpeg-ts,audio-aac,audio-vorbis,http
  # shared compiler cache: sccache (mounted from the runner VM) -> garage S3
  # on vm-runner-01; S3 endpoint+credentials come from the runner's env_file
  RUSTC_WRAPPER: /srv/cache/bin/sccache
  CARGO_INCREMENTAL: "0"
  # Resolved 2026-08-20 (#203): the runner was not short of memory, it was
  # ballooned. pvestatd had pinned vm-runner-01 at a 2 GiB floor while the
  # host was full, so the guest saw 1.7 GiB of its nominal 10 GiB and the OOM
  # killer took whichever rustc happened to be largest. The balloon is gone;
  # the runner now has 9.9 GiB plus 4 GiB of zram.
  #
  # debuginfo is still off: it dominates rustc's peak RSS and is worth nothing
  # to a job that only checks, lints or runs tests. Cargo applies the *dev*
  # profile's debug setting to the test profile too, but both are set so a
  # future profile split cannot regress it.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Cap build parallelism: cargo otherwise defaults to nproc (6 on
  # vm-runner-01) per job, against a lane capacity of 2.
  CARGO_BUILD_JOBS: "2"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev g++ libclang-dev
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features "$SENSOR_FEATURES,image-codecs" -- -D warnings
      - run: cargo clippy --all-targets --features "$MEDIA_FEATURES" -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev g++ libclang-dev
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - uses: https://github.com/taiki-e/install-action@v2.86.1
        with:
          tool: cargo-nextest
      - run: cargo nextest run
      - run: cargo test --doc
      # #176: the job's three feature combos build into one container
      # overlay on the runner's 50G root disk, and their combined target/
      # no longer fits — the third build died with ENOSPC (and an ld Bus
      # error, which is the same failure wearing a disguise). Dropping
      # target/ between combos caps the peak at one combo's worth; the
      # recompile is cheap because sccache serves it from garage S3.
      - run: rm -rf target
      - run: cargo check --all-targets --features "$SENSOR_FEATURES"
      - run: cargo nextest run --features "$SENSOR_FEATURES"
      - run: rm -rf target
      - run: cargo nextest run --features "$MEDIA_FEATURES"

  msrv:
    runs-on: ubuntu-24.04
    # Outranks `rust-toolchain.toml` (rustup: RUSTUP_TOOLCHAIN > directory
    # override > default), which is the only reason this job still tests the
    # MSRV rather than re-testing the pin.
    env:
      RUSTUP_TOOLCHAIN: "1.97"
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev g++ libclang-dev
      # `rust-toolchain.toml` pins the *development* toolchain and rustup
      # applies it to every cargo invocation in the repo — including this one,
      # which would quietly turn the MSRV job into a second copy of the others.
      # `RUSTUP_TOOLCHAIN` outranks the file, so this is what keeps the job
      # honest. The number here is the MSRV; `Cargo.toml`'s `rust-version` is
      # the contract it enforces.
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: msrv
          cache-targets: false
      - run: cargo check --all-targets
      # Same disk discipline as the test job (#176) — msrv shares the root
      # disk with whatever else the runner is executing.
      - run: rm -rf target
      - run: cargo check --all-targets --features "$SENSOR_FEATURES"

  libcamera:
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    steps:
      # no node in fedora:44 → install it first so JS actions work
      - run: dnf install -y nodejs git gcc gcc-c++ clang-devel libcamera-devel systemd-devel pipewire-devel pkgconf-pkg-config tar xz zstd
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: libcamera
          cache-targets: false
      - uses: https://github.com/taiki-e/install-action@v2.86.1
        with:
          tool: cargo-nextest
      - run: cargo clippy --all-targets --features libcamera -- -D warnings
      # #170: pipewire/screen-capture had no compiling job, which is how the
      # libspa 0.8 breakage (and before it, the e1f345b shutdown bug) went
      # unnoticed. Folded in here rather than a new job so the runner disk
      # carries one fedora target dir, not two (#176).
      - run: cargo clippy --all-targets --features pipewire,screen-capture -- -D warnings
      - run: cargo nextest run --features libcamera -E 'test(libcamera) | test(monitor)'

  # Compile-check the Vulkan Video GPU path (no runner has a capable GPU, so
  # tests would only green-skip — this at least keeps the code from rotting
  # un-compiled). image-jpeg is needed to compile elements::codec at all.
  # cargo check, not clippy: vulkan-video lint debt is tracked in #3.
  vulkan-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: vulkan
          cache-targets: false
      - uses: https://github.com/taiki-e/install-action@v2.86.1
        with:
          tool: cargo-nextest
      # Most of what `vulkan-video` gates is CPU-only and testable without a
      # GPU: slice-header parsing, POC computation, reference marking, the std
      # struct marshalling. `tests/vulkan_decode_tests.rs` green-skips when no
      # capable device is present, so the whole set is safe to run here.
      - run: cargo nextest run --features image-jpeg,vulkan-video
      - run: cargo check --all-targets --features image-jpeg,vulkan-video

  # Feature gates no other job compiles. `display` builds here; `pipewire` and
  # `screen-capture` build in the libcamera fedora job (#170).
  display-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev g++ libclang-dev
      # Without `components`, the toolchain has no clippy and the job fails
      # with "'cargo-clippy' is not installed", not with a lint.
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: display
          cache-targets: false
      # Both, and in this order. `display-gpu` gates the whole wgpu backend
      # (#190) and was compiled by nothing (#255); it needs no driver to build,
      # only to run. And the combined build is not a superset in practice — a
      # module that loses its cfg gate compiles here and breaks the
      # `display`-alone build below, which has happened.
      - uses: https://github.com/taiki-e/install-action@v2.86.1
        with:
          tool: cargo-nextest
      # The tests run headless — the display elements' unit tests are pure
      # geometry and colour maths (letterbox rects, plane strides, dma-buf
      # plane validation) and need no window or driver. Clippy alone left 38
      # test functions compiled and never executed.
      - run: cargo nextest run --features display,display-gpu
      - run: cargo clippy --all-targets --features display,display-gpu -- -D warnings
      - run: cargo clippy --all-targets --features display -- -D warnings

  # The last feature gates nothing else compiles. Not a theoretical gap:
  # `aac-encode` had been broken since before the version master locked —
  # `AacEncoder` called an `fdk-aac` signature no published release has — and
  # no job or recipe ever asked, so nothing reported it. Cheap to hold: all
  # four are pure-Rust or vendored-source deps that build in seconds.
  #
  #   aac-encode  fdk-aac (compiles FDK from source, hence g++)
  #   websocket   tungstenite
  #   alsa        libasound2-dev
  #   v4l2-m2m    v4l2r, bindgen against kernel headers, hence libclang-dev
  feature-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y g++ libclang-dev libasound2-dev
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: feature-gates
          cache-targets: false
      - uses: https://github.com/taiki-e/install-action@v2.86.1
        with:
          tool: cargo-nextest
      # `eac3,audio-flac,audio-mp3,cli,macros` are pure Rust and were compiled
      # by nothing at all (#255) — `cli` gates `src/bin/parallax_launch.rs` and
      # `tests/launch_cli.rs`, a binary and its whole test suite that had never
      # been built here. No new apt packages; they cost only build time.
      # `zenoh` is here for `cli`'s sake, not its own: `tests/launch_cli.rs` is
      # `required-features = ["cli"]` and its three async-constructor tests —
      # the acceptance shape for #222 — are additionally `cfg(feature =
      # "zenoh")`. No job combined the two, so those three had never run.
      # `image-png` likewise: it was linted and documented, never executed.
      - run: cargo nextest run --features aac-encode,websocket,alsa,v4l2-m2m,eac3,audio-flac,audio-mp3,cli,macros,zenoh,image-png
      - run: cargo clippy --all-targets --features aac-encode,websocket,alsa,v4l2-m2m,eac3,audio-flac,audio-mp3,cli,macros,zenoh,image-png -- -D warnings

  # The *degraded* zenoh build (#230): `zenoh` without `zenoh-unstable`.
  #
  # Every other job that touches zenoh enables both, so nothing asked whether
  # the code still compiles — let alone behaves — when the matching listener
  # is unavailable. It is supposed to degrade: `ZenohSinkHandle` still exists,
  # its event stream is simply always empty, and `has_viewers()` fails **open**
  # so an idle reaper never kills a live stream because the build cannot tell.
  # That is exactly the kind of claim that rots un-compiled (gotcha 11b).
  #
  # A job of its own rather than a line in `feature-gates`: zenoh is a large
  # dependency tree, and the matrix has been retuned for OOM twice (#203).
  zenoh-degraded:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y g++
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: zenoh-degraded
          cache-targets: false
      - uses: https://github.com/taiki-e/install-action@v2.86.1
        with:
          tool: cargo-nextest
      - run: cargo nextest run --features zenoh
      - run: cargo clippy --all-targets --features zenoh -- -D warnings

  # VA-API decode (#193). Runner has no GPU, so this proves the build and runs
  # the green-skip tests; real decode is validated on hardware locally.
  vaapi-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libva-dev libclang-dev libvpx-dev pkg-config g++
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: vaapi
          cache-targets: false
      - uses: https://github.com/taiki-e/install-action@v2.86.1
        with:
          tool: cargo-nextest
      - run: cargo nextest run --features vaapi,mkv-demux,mp4-demux,vpx,h264
      - run: cargo clippy --all-targets --features vaapi,mkv-demux,mp4-demux,vpx,h264 -- -D warnings

  # The SIMD colorspace arms (the `yuv` crate) are a second implementation of
  # every conversion, selected by a feature no other job enables. The scalar
  # arms are what a bare `cargo build` ships, so both families need running:
  # untested, they rot silently (#196) — or diverge (#265).
  simd-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev g++ libclang-dev
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          key: simd
          cache-targets: false
      - uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --features simd-colorspace
      - run: cargo clippy --all-targets --features simd-colorspace -- -D warnings

  # The media-full combo (`just check-media-full`), which no workflow mirrored
  # (#255). `opus`, `av1-decode` and `av1-encode` were compiled by nothing at
  # all — and that gap hid a clippy error in the Opus encoder from the moment
  # the toolchain was pinned to 1.98 until it was found by accident, leaving
  # the recipe red on master the whole time.
  #
  # `$MEDIA_FEATURES` is reused rather than spelled out so this job and the
  # recipe cannot drift apart the way the recipe drifted from CI.
  codec-libs:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libopus-dev libdav1d-dev libvpx-dev nasm g++ libclang-dev pkg-config
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: codec-libs
          cache-targets: false
      - uses: https://github.com/taiki-e/install-action@v2.86.1
        with:
          tool: cargo-nextest
      - run: cargo nextest run --features "$MEDIA_FEATURES,vpx,av1-decode,av1-encode,opus,h264"
      - run: cargo clippy --all-targets --features "$MEDIA_FEATURES,vpx,av1-decode,av1-encode,opus,h264" -- -D warnings

  # The workspace members nothing builds. `default-members = ["."]` keeps a
  # bare `cargo build` narrow on purpose (see Cargo.toml), and no job passes
  # `-p` or `--workspace` — so the proc-macro crate and the example plugin
  # were never compiled by CI at all (#255). Checking them explicitly closes
  # that without widening the default set. The player has its own job below.
  workspace-members:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev g++ libclang-dev pkg-config
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: workspace-members
          cache-targets: false
      - run: cargo clippy -p parallax-pipeline-macros --all-targets -- -D warnings
      - run: cargo clippy -p example-plugin --all-targets -- -D warnings

  # The feature union the crossterm player used to carry (#277). Every feature
  # here is built by some other job — display-check, vaapi-check, simd-check —
  # but only in its own dependency graph, and `cargo clippy -p parallax-player`
  # was the one build that put them together. It also built the root crate as
  # a *dependency*, so `cfg(test)` was off for it: `#[cfg(all(test, feature =
  # "vaapi"))] mod hardware_tests` in `present/dmabuf_import.rs` was compiled
  # by nothing at all. `--all-targets` on the root crate compiles it.
  #
  # Do not fold this into display-check: what is being checked is the *union*,
  # and a job that builds half of it proves nothing about the other half.
  feature-union:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev g++ libclang-dev libdav1d-dev libopus-dev libvpx-dev libasound2-dev libva-dev pkg-config
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: feature-union
          cache-targets: false
      - run: cargo clippy --all-targets --features mp4-demux,mkv-demux,vpx,av1-decode,opus,h264,display,display-gpu,simd-colorspace,audio-aac,audio-vorbis,eac3,alsa,vaapi -- -D warnings

  # The Iced integration crate (#267). Separate from `workspace-members`
  # because it needs the windowing/font system libraries and nothing else in
  # the workspace does — and because the `cargo tree -d` assertion below is
  # the only thing standing between us and two wgpu majors in one binary.
  iced:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev fonts-dejavu-core libasound2-dev libva-dev libdav1d-dev libopus-dev libvpx-dev libudev-dev g++ libclang-dev pkg-config
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: iced
          cache-targets: false
      - uses: https://github.com/taiki-e/install-action@nextest
      - run: cargo clippy -p parallax-iced --all-targets -- -D warnings
      - run: cargo clippy -p parallax-player --all-targets -- -D warnings
      - run: cargo nextest run -p parallax-iced
      - run: cargo nextest run -p parallax-player
      - name: exactly one wgpu, and one ashpd
        run: |
          ! cargo tree -p parallax-iced -d 2>/dev/null | grep -q "^wgpu"
          ! cargo tree -p parallax-player -d 2>/dev/null | grep -q "^wgpu"
          ! cargo tree -p parallax-player -d 2>/dev/null | grep -q "^ashpd"
      # The player, end to end, with no compositor and no sound card (#277).
      # `--headless` makes this process the host: it drains the frame mailbox
      # at the same due times the widget does, so "frames were presented" is
      # a real claim about demux, decode, sync and pacing.
      - name: the player plays
        run: |
          cargo build -p parallax-player
          ./target/debug/parallax-player --headless --exit-after=5 tests/fixtures/tiny_h264_aac.mkv \
            | tee /dev/stderr | grep -qE 'presented=[1-9]'

  docs:
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev g++ libclang-dev
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: cargo doc --no-deps --features "$SENSOR_FEATURES,image-codecs"
