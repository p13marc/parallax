# Temporary sccache diagnosis (#176) — deleted once ci.yml carries the fix.
name: maintenance
on:
  workflow_dispatch:

jobs:
  disk:
    runs-on: ubuntu-24.04
    steps:
      - name: sccache-facts
        run: |
          set -x
          df -h | grep -vE "tmpfs|shm"
          ls -la /srv/cache/bin/ || true
          touch /srv/cache/bin/.write-probe && echo WRITABLE && rm /srv/cache/bin/.write-probe || echo READ-ONLY
          env | grep -iE "sccache|aws|s3" || echo "no sccache/s3 env"
          /srv/cache/bin/sccache --start-server || true
          /srv/cache/bin/sccache --show-stats || true
